services:
    frontend:
        build:
            context: ./docker/frontend
            dockerfile: dev.Dockerfile
        container_name: frontend
        environment:
            VITE_API_PROXY_TARGET: http://nginx
        ports:
            - "5173:5173"
        volumes:
            - ./frontend_app:/app
        user: "1000:1000"
        networks:
            - frontend_app
        depends_on:
            - nginx

    nginx:
        image: nginx:1.30-alpine
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./backend_app:/app
        container_name: nginx
        ports:
            - "8000:80"
        networks:
            - frontend_app
            - backend_app
        depends_on:
            - php

    php:
        build:
            context: ./
            dockerfile: ./docker/backend/php/dev.Dockerfile
        environment:
            SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000
        networks:
            - backend_app
        container_name: php
        volumes:
            - ./backend_app:/app/
            - ./docker/backend/php/dev.custom.ini:/usr/local/etc/php/conf.d/dev.custom.ini
            - ./docker/backend/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
        user: "1000:1000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        container_name: postgres
        environment:
            POSTGRES_DB: time_track
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
        networks:
            - backend_app
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d time_track"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        container_name: redis
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - backend_app
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    queue-worker:
        build:
            context: ./
            dockerfile: ./docker/backend/php/dev.Dockerfile
        working_dir: /app
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --name=notifications
            - --queue=notifications,default
            - --sleep=1
            - --tries=3
            - --timeout=30
            - --memory=256
            - --max-time=3600
            - --verbose
        environment:
            XDEBUG_MODE: "off"
        volumes:
            - ./backend_app:/app/
            - ./docker/backend/php/dev.custom.ini:/usr/local/etc/php/conf.d/dev.custom.ini
        user: "1000:1000"
        init: true
        restart: unless-stopped
        stop_grace_period: 45s
        networks:
            - backend_app
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

networks:
    backend_app:
        driver: bridge
    frontend_app:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
